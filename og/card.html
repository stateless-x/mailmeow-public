<!doctype html>
<!--
  Share card for LINE, Facebook and X (og:image), 1200x630. Regenerate with `bun run og`
  (scripts/og.sh renders ?lang=th and ?lang=en with headless Chrome into public/).
  Colours, fonts and the mascot follow docs/design/DESIGN.md; copy follows copy/landing.md §0.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Mitr; font-weight: 600; src: url(../node_modules/@fontsource/mitr/files/mitr-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Mitr; font-weight: 600; src: url(../node_modules/@fontsource/mitr/files/mitr-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Body; font-weight: 500; src: url(../node_modules/@fontsource/anuphan/files/anuphan-thai-500-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Body; font-weight: 500; src: url(../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-500-normal.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F8F4EC; color: #1F1B16; font-family: Body, sans-serif; display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 40px; padding: 64px 72px; }
  .mark { display: flex; align-items: center; gap: 12px; font-family: Mitr; font-weight: 600; font-size: 34px; }
  .mark svg { width: 48px; height: 24px; color: #5B34DA; }
  h1 { font-family: Mitr; font-weight: 600; font-size: 76px; line-height: 1.3; margin-top: 36px; }
  :lang(en) h1 { font-size: 72px; line-height: 1.12; }
  .hl { box-shadow: inset 0 -0.42em 0 #C9F25A; }
  p { font-size: 30px; line-height: 1.5; margin-top: 28px; color: #5F574B; max-width: 22em; }
  .art { position: relative; height: 100%; display: grid; place-items: end center; }
  .art img { width: 320px; height: 320px; image-rendering: pixelated; }
  .badge { position: absolute; top: 40px; left: 8px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 28px; font-weight: 500; color: #17703F; background: #DFF2DF; border: 1.5px solid #1F1B16; border-radius: 999px; box-shadow: 0 3px 0 #1F1B16; transform: rotate(-3deg); }
  .badge svg { width: 26px; height: 26px; }
  [data-lang] { display: none; }
</style>
</head>
<body>
  <div>
    <div class="mark">
      <svg viewBox="0 0 24 12" aria-hidden="true"><path d="M4 6h12" stroke="currentColor" stroke-width="1.5"/><circle cx="3.5" cy="6" r="2" fill="currentColor"/><circle cx="11" cy="6" r="2" fill="currentColor"/><circle cx="19.5" cy="6" r="4.5" fill="currentColor"/></svg>
      mailmeow
    </div>
    <div data-lang="th" lang="th">
      <h1>ลูกค้าไม่ได้รับอีเมล OTP <span class="hl">อีกแล้ว</span></h1>
      <p>Email API ที่บอกได้ทุกฉบับว่าอีเมลถึงหรือยัง</p>
    </div>
    <div data-lang="en" lang="en">
      <h1>Users didn't get their login code. <span class="hl">Again.</span></h1>
      <p>The email API that tells you whether every email arrived.</p>
    </div>
  </div>
  <div class="art">
    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span data-lang="th">ส่งถึงแล้ว</span><span data-lang="en">Delivered</span></span>
    <img src="../public/mailmeow-portrait@8x.png" alt="" />
  </div>
  <script>
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'th';
    document.documentElement.lang = lang;
    document.querySelectorAll(`[data-lang="${lang}"]`).forEach((el) => (el.style.display = el.tagName === 'SPAN' ? 'inline' : 'block'));
  </script>
</body>
</html>
